<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evenet Delegate</title>
</head>
<body>
    
    <h1>Explore the consept of Event Delegate</h1>
    <ol id="item-list">
        <li class="item">My Awesome item1</li>
        <li class="item">My Awesome item2</li>
        <li class="item">My Awesome item3</li>
        <li class="item">My Awesome item4</li>
        <li class="item">My Awesome item5</li>
        <li class="item">My Awesome item6</li>
    </ol>
    <button id="btn-add-item">Add New Item</button>
    <script>

    //    const items = document.getElementsByClassName('item');
    //    for (const item of items){
    //       item.addEventListener('click',
    //       function (event){
    //       //    console.log(event.target.parentNode)
    //        event.target.parentNode.removeChild(event.target);
    //       }) 
    //    }


       document.getElementById('item-list').addEventListener('click', 
        function(event){
          console.log(event.target);
          event.target.parentNode.removeChild(event.target);
        }
       )

       // add new item
       document.getElementById('btn-add-item').addEventListener('click', 
        function(){
            // parent to be added 
            const ol = document.getElementById('item-list');

            // new item 
            const li = document.getElementById('li');
            li.classList.add('item')
            li.innerText = 'Brand new item added';

            //add the item 
            ol.appendChild(li);
        }
       )

    </script>

    <script src="event.js"></script>
</html>
