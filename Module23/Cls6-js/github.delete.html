<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>event handler</title>
</head>
<body>
    <h1 id="secrat-info">My Secret info</h1>
    <input type="text" name="" id=" input-delete" placeholder="Write Delete">

    <button id="btn-delete" disabled>delete</button>

    <script>
        document.getElementById('input-delete').addEventListener('keyup', 
            function (event) {
                const text = event.target.value;
                const btnDelete = document.getElementById('btn-delete');
    
                // console.log(text);
                // console.log('user is typing ')
                if(text === 'delete'){
                   console.log('delete typed');
                   btnDelete.removeAttribute('disabled')
                   
                   const secret = document.getElementById('secret-info');
                   secret.style.display = 'none';
                }
                else{
                    console.log('something else');
                    btnDelete.setAttribute('disabled', true)
                }
            }
        )
    </script>
</body>
</html>
