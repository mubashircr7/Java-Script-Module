<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Dom Event Summary</h1>
    <input type="text" placeholder="Your Name" id="name-input">
    <button onclick=""> Add Name</button>
    <button id="btn-add-name">Add Name 2</button>
    <div id="name-container">

    </div>

    <script>
       function addname(){
        const nameInput = document.getElementById('name-input');
        const newName = nameInput.value;

        //parent 
        const nameContainer = document.getElementById('name-container')

        //creat p
        const p = document.createElement('p');
        p.innerText = newName

        //append
        nameContainer.appendChild(p);

        nameInput.value = '';
       }

       // add even listener
       document.getElementById('btn-add-name').addEventListener('click',
        function(){
            document.body.style.backgroundColor = 'gold'
        }
       )
    </script>

    <script src="event.js"></script>
</body>
</html>
